# Checks on every push that the app still builds and passes its tests on
# Linux: development happens on Windows, where a Linux-only break would
# otherwise surface only at release time.
name: Linux

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Dipendenze
        working-directory: app
        run: npm ci

      - name: Frontend tests
        working-directory: app
        run: npx vitest run

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Rust tests
        working-directory: app/src-tauri
        # Failures also become annotations, readable on the run page.
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee test.log || {
            grep -E -A4 '^error(\[|:)|panicked at' test.log | head -60 | sed 's/^/::error::/'
            exit 1
          }
